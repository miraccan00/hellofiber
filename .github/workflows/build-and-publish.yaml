name: Build and Publish Docker image

# Every push builds and publishes ghcr.io/<owner>/hellofiber:sha-<7 chars>.
# `latest` is only moved on main. Multi-arch, so the image also runs on
# Apple Silicon kind nodes (arm64).
on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.vars.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hellofiber:${{ steps.vars.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/hellofiber:latest', github.repository_owner) || '' }}
